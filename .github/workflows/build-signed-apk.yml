name: Build signed Offer Filter

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build-local.sh"
      - "private-signing/**"
      - ".github/workflows/build-signed-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY_B64: private-signing/offer-filter-reset.p12.b64
      SIGNING_KEY: \${{ github.workspace }}/.signing/offer-filter-reset.p12
      SIGNING_ALIAS: offerfilter-reset
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Restore private signing key
        env:
          SIGNING_PASSWORD: \${{ secrets.OFFER_FILTER_SIGNING_PASSWORD }}
        run: |
          test -n "$SIGNING_PASSWORD" || {
            echo "Missing repository secret OFFER_FILTER_SIGNING_PASSWORD" >&2
            exit 1
          }
          mkdir -p .signing
          base64 --decode "$SIGNING_KEY_B64" > "$SIGNING_KEY"
          chmod 600 "$SIGNING_KEY"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed APK
        env:
          OFFER_FILTER_KEYSTORE: \${{ github.workspace }}/.signing/offer-filter-reset.p12
          OFFER_FILTER_KEY_ALIAS: offerfilter-reset
          OFFER_FILTER_KEYSTORE_PASS_SPEC: env:OFFER_FILTER_SIGNING_PASSWORD
          OFFER_FILTER_KEY_PASS_SPEC: env:OFFER_FILTER_SIGNING_PASSWORD
          OFFER_FILTER_SIGNING_PASSWORD: \${{ secrets.OFFER_FILTER_SIGNING_PASSWORD }}
        run: ./build-local.sh

      - name: Verify signer and write receipt
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          VERSION=$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" app/build.gradle)
          CODE=$(sed -n 's/.*versionCode \\([0-9][0-9]*\\).*/\\1/p' app/build.gradle)
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(wc -c < "$APK" | tr -d ' ')
          {
            echo "versionName=$VERSION"
            echo "versionCode=$CODE"
            echo "sha256=$SHA"
            echo "size=$SIZE"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          } > app/build/outputs/apk/debug/signing-receipt.txt

      - uses: actions/upload-artifact@v4
        with:
          name: OfferFilter-signed
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/signing-receipt.txt
          if-no-files-found: error
          retention-days: 30
