name: Archived cloud Android tests (local build is default)

# Do not dispatch without a new explicit exception to the user's local-only
# build/test/sign directive. Normal releases use tools/sign-local.sh locally.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: ./gradlew --no-daemon testDebugUnitTest -PallSdks
      # No independent signing key, release upload, or source mutation from this workflow.
