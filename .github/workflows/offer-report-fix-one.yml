name: Offer report fixer (one report)

# Called by offer-report-fixer.yml for one report issue. Three jobs, each with only the access it needs:
#   diagnose  Claude reads the report and may commit a fix locally. Read-only token; the result leaves the job
#             only as a git bundle artifact.
#   gate      A fresh machine applies that one commit on top of main and runs tools/fixer/gate.sh as it was on
#             main before the fix. Read-only: this is where the fix's own code (its tests) runs.
#   ship      Pushes exactly the commit the gate passed, waits for Render and verifies the live APK, then reports
#             on the issue. The only job that can write, and it runs no code from the fix.

on:
  workflow_call:
    inputs:
      issue:
        type: number
        required: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: read
    outputs:
      base: ${{ steps.start.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: start
        name: Save the report
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: |
          mkdir -p .fixer
          gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json number,title,body > .fixer/issue.json
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git config user.name "Offer Filter fixer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # No build caches here or in the gate: this job runs code the model wrote, and a cache it saved would be
      # restored into the gate and into later runs.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - id: claude
        name: Diagnose and fix (Claude)
        continue-on-error: true
        timeout-minutes: 60
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job's own read-only token, so the session never holds one that can change the repository.
          github_token: ${{ github.token }}
          prompt: |
            Follow tools/fixer/PLAYBOOK.md exactly for problem report #${{ inputs.issue }}, saved in .fixer/issue.json.
            End by writing .fixer/result.json as the playbook describes. Do not push, open pull requests, or comment
            on GitHub; the workflow does that after its own checks.
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(./gradlew:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*)"

      - name: Package the outcome
        if: always()
        env:
          BASE: ${{ steps.start.outputs.base }}
          CLAUDE: ${{ steps.claude.outcome }}
        run: |
          out="$RUNNER_TEMP/outcome"
          mkdir -p "$out"
          echo "${CLAUDE:-skipped}" > "$out/claude"
          if [ -f .fixer/result.json ]; then cp .fixer/result.json "$out/result.json"; fi
          if [ -n "$BASE" ] && [ "$(git rev-list --count "$BASE"..HEAD)" -gt 0 ]; then
            git branch -f fixer-result HEAD
            git bundle create "$out/fix.bundle" "$BASE..fixer-result"
          fi
          ls -l "$out"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixer-${{ inputs.issue }}-diagnosis
          path: ${{ runner.temp }}/outcome
          retention-days: 1

  gate:
    needs: diagnose
    if: ${{ !cancelled() && needs.diagnose.outputs.base != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.gate.outcome }}
      commit: ${{ steps.gate.outputs.commit }}
    env:
      BASE: ${{ needs.diagnose.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.diagnose.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: fixer-${{ inputs.issue }}-diagnosis
          path: ${{ runner.temp }}/outcome

      - id: read
        name: Read the fixer's outcome
        run: |
          outcome="$(jq -r '.outcome // empty' "$RUNNER_TEMP/outcome/result.json" 2>/dev/null || true)"
          claude="$(cat "$RUNNER_TEMP/outcome/claude" 2>/dev/null || true)"
          echo "Fixer outcome: ${outcome:-none}; Claude step: ${claude:-unknown}"
          # A session that ran out of turns or time did not finish, whatever it wrote; nothing of it ships.
          fixed=false
          if [ "$outcome" = fixed ] && [ "$claude" = success ]; then fixed=true; fi
          echo "fixed=$fixed" >> "$GITHUB_OUTPUT"
          # The checks as they are on main, taken before the fix is checked out.
          cp -r tools/fixer "$RUNNER_TEMP/fixer"

      - uses: actions/setup-java@v4
        if: steps.read.outputs.fixed == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.read.outputs.fixed == 'true'
      - if: steps.read.outputs.fixed == 'true'
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - id: gate
        name: Release gate
        if: steps.read.outputs.fixed == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            bundle="$RUNNER_TEMP/outcome/fix.bundle"
            [ -f "$bundle" ] || { echo "GATE FAILED: the fixer reported a fix but left no commit"; exit 1; }
            git bundle verify -q "$bundle"
            git fetch -q "$bundle" "fixer-result:refs/fixer/result"
            commit="$(git rev-parse refs/fixer/result)"
            git -c advice.detachedHead=false checkout -q "$commit"
            echo "commit=$commit" >> "$GITHUB_OUTPUT"
            bash "$RUNNER_TEMP/fixer/gate.sh" "$BASE"
          } 2>&1 | tee "$RUNNER_TEMP/gate.log"

      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outcome != 'skipped'
        with:
          name: fixer-${{ inputs.issue }}-gate
          path: ${{ runner.temp }}/gate.log
          retention-days: 1

  ship:
    needs: [diagnose, gate]
    # A cancelled run pushes nothing; its report stays marked fixer:working and the next run picks it up.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    env:
      ISSUE: ${{ inputs.issue }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Main as the fix started from; this job never checks out the fix itself.
          ref: ${{ needs.diagnose.outputs.base || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: fixer-${{ inputs.issue }}-diagnosis
          path: ${{ runner.temp }}/report
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: fixer-${{ inputs.issue }}-gate
          path: ${{ runner.temp }}/report

      - name: Prepare the report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPORT="$RUNNER_TEMP/report"
          mkdir -p "$REPORT"
          cp -r tools/fixer "$RUNNER_TEMP/fixer"
          gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json number,title > "$REPORT/issue.json"

      - id: release
        name: Push the gated commit to main (Render builds, signs and publishes)
        if: needs.gate.outputs.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PASSED: ${{ needs.gate.outputs.commit }}
        run: |
          REPORT="$RUNNER_TEMP/report"
          git fetch -q "$REPORT/fix.bundle" "fixer-result:refs/fixer/result"
          commit="$(git rev-parse refs/fixer/result)"
          [ "$commit" = "$PASSED" ] || { echo "The bundle is not the commit the gate passed." >&2; exit 1; }
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$commit:refs/heads/main"
          echo "$commit" > "$REPORT/released-sha"

      - uses: actions/setup-java@v4
        if: steps.release.outcome == 'success'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.release.outcome == 'success'
      - if: steps.release.outcome == 'success'
        run: sdkmanager 'build-tools;35.0.0'

      - id: verify
        name: Wait for Render and verify the live APK
        if: steps.release.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          REPORT="$RUNNER_TEMP/report"
          bash "$RUNNER_TEMP/fixer/await_release.sh" "$(cat "$REPORT/released-sha")" 2400 2>&1 | tee "$REPORT/release.log"

      - name: Report back on the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FIXER_DIR: ${{ runner.temp }}/report
          GATE: ${{ needs.gate.outputs.outcome }}
          RELEASE: ${{ steps.release.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        run: python3 "$RUNNER_TEMP/fixer/report_back.py"
