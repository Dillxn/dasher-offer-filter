plugins {
    id 'com.android.application'
}
android {
    namespace 'com.local.dasherfilter'
    compileSdk 36
    defaultConfig {
        applicationId 'com.local.dasherfilter'
        minSdk 26
        targetSdk 35
        versionCode 49
        versionName '0.4.43'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = '1536m'
            // Test classes run in parallel JVMs; Robolectric keeps no state across them.
            maxParallelForks = 3
            // Day to day only Android 15 is simulated; a release, the fixer's gate and Render pass -PallSdks
            // so Android 8 runs too.
            if (!project.hasProperty('allSdks')) systemProperty 'robolectric.enabledSdks', '35'
        }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
