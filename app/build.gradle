plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.dasherfilter'
    compileSdk 36

    defaultConfig {
        applicationId 'com.local.dasherfilter'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.4.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
