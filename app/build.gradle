plugins {
    id 'com.android.application'
}

// -PtestHeap=768m lowers each test JVM's heap without changing the normal default.
def testHeap = providers.gradleProperty('testHeap').getOrElse('1536m')
if (!(testHeap ==~ /[1-9][0-9]*[mMgG]/)) {
    throw new GradleException('Invalid -PtestHeap: use a positive whole number with m or g, e.g. -PtestHeap=768m.')
}

// Development checks use the existing API 35/C1 profile, with reports separate from the release gate.
def devChecks = providers.gradleProperty('devChecks').isPresent()
if (devChecks && providers.gradleProperty('allSdks').isPresent()) {
    throw new GradleException('-PdevChecks cannot be combined with -PallSdks; use the normal full release command.')
}
// Keep development task-output history separate too: an empty task can clean its previous execution's outputs.
def devCacheDir = rootProject.file('.gradle/dev-checks').canonicalFile
def usesDevCache = gradle.startParameter.projectCacheDir?.canonicalFile == devCacheDir
if (devChecks != usesDevCache) {
    throw new GradleException('Use tools/test-dev.sh: -PdevChecks and --project-cache-dir .gradle/dev-checks belong together.')
}
// Source-contract tests inspect these bytes directly, including comments and the repository's legal documents.
def inspectedSources = fileTree('src/main') { include '**/*.java', '**/*.xml' }
def inspectedLegalTexts = rootProject.files('TERMS.md', 'PRIVACY.md', 'LICENSE')

android {
    namespace 'com.local.dasherfilter'
    compileSdk 36
    defaultConfig {
        applicationId 'com.local.dasherfilter'
        minSdk 26
        targetSdk 35
        versionCode 88
        versionName '0.5.8'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            inputs.files(inspectedSources).withPropertyName('inspectedSources')
                    .withPathSensitivity(PathSensitivity.RELATIVE)
            inputs.files(inspectedLegalTexts).withPropertyName('inspectedLegalTexts')
                    .withPathSensitivity(PathSensitivity.RELATIVE)
            if (devChecks) {
                reports.junitXml.outputLocation.set(project.layout.buildDirectory.dir("test-results/devChecks/${name}"))
                binaryResultsDirectory.set(project.layout.buildDirectory.dir("test-results/devChecks/${name}/binary"))
                reports.html.outputLocation.set(project.layout.buildDirectory.dir("reports/tests/devChecks/${name}"))
            }
            maxHeapSize = testHeap
            // A test that never ends (a read re-posted forever on the paused looper, say) fails the run instead of
            // stalling the release gate; the whole -PallSdks suite with one JVM takes far less.
            timeout = java.time.Duration.ofMinutes(90)
            // Test classes run in parallel JVMs; Robolectric keeps no state across them. Gradle deals the classes out
            // to the JVMs in turn, by name, and never splits one, so no class should run much longer than the rest.
            // -Pforks=N sets how many JVMs (e.g. -Pforks=1 when several worktrees build at once).
            maxParallelForks = (project.findProperty('forks') ?: '3') as int
            // Day to day only Android 15 is simulated; a release (tools/sign-local.sh) passes -PallSdks so
            // Android 8 runs too.
            if (!project.hasProperty('allSdks')) {
                systemProperty 'robolectric.enabledSdks', '35'
                // Quick JIT for day-to-day runs (about 15% faster here); releases keep the full JIT. C1 alone gets
                // a 48 MB code cache by default, which a JVM running half the suite (-Pforks=2) fills ("Out of
                // space in CodeCache for adapters"): it gets the full JIT's 240 MB.
                jvmArgs '-XX:TieredStopAtLevel=1', '-XX:ReservedCodeCacheSize=240m'
            }
        }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
