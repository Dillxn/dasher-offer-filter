// The owner, 23 November 2026: Google's copy of Maven Central is "always ok" (Maven Central answered this
// machine 429). Every Maven Central repository the build declares resolves from the mirror instead, and
// Robolectric's runtime jars (android-all) come from it too. Local to this machine; nothing in the repo changes.
def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
def isCentral = { repo ->
    repo instanceof MavenArtifactRepository &&
            repo.url.toString().replaceAll('/+$', '') in ['https://repo.maven.apache.org/maven2', 'https://repo1.maven.org/maven2']
}
settingsEvaluated { settings ->
    [settings.pluginManagement.repositories, settings.dependencyResolutionManagement.repositories].each { repos ->
        repos.all { repo -> if (isCentral(repo)) repo.url = mirror }
    }
}
allprojects {
    tasks.withType(Test).configureEach {
        systemProperty 'robolectric.dependency.repo.url', mirror
        systemProperty 'robolectric.dependency.repo.id', 'google-maven-central'
    }
}
